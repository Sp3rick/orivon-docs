<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/img/orivon-mark.svg" />
    <link rel="icon" type="image/png" href="/img/OrivonLogo.png" />
    <meta
      name="description"
      content="Orivon is the browser for the next generation of the web. A trustless, user-friendly Web3 browsing system built on new open standards. Official documentation."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="Orivon Documentation" />
    <meta property="og:title" content="Orivon Documentation" />
    <meta
      property="og:description"
      content="The official documentation for Orivon, the browser for the next generation of the web."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://docs.orivonstack.com" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <title>Orivon Documentation</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('orivon-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
